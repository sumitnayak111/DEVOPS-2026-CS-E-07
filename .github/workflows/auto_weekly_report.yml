name: Weekly Progress Report Auto-Commit

on:
  schedule:
    # Every Saturday at 11:59 PM IST

    # IST = UTC + 5:30 → 18:29 UTC

    - cron: "29 18 * * 6"

  # Allows manual execution from GitHub Actions

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository

      - name: Checkout Repository

        uses: actions/checkout@v4

        with:
          fetch-depth: 0

      # 2. Setup Python

      - name: Set up Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.x"

      # 3. Install dependencies

      - name: Install PDF and Graph Dependencies

        run: |

          python -m pip install --upgrade pip

          pip install reportlab matplotlib

      # 4. Generate weekly report

      - name: Generate Weekly PDF Report

        run: |

          python generate_report.py weekly

      # 5. Archive and commit report

      - name: Move PDF and Commit

        run: |

          mkdir -p weekly_reports

          if [ -f "Weekly_Progress_Report_Form-3.pdf" ]; then

            mv Weekly_Progress_Report_Form-3.pdf weekly_reports/

          else

            echo "PDF report was not generated."

            exit 1

          fi

          git config user.name "github-actions[bot]"

          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add weekly_reports/

          if git diff --cached --quiet; then

            echo "No new report to commit."

          else

            git commit -m "docs: archive weekly progress report"

            git push origin main

          fi
